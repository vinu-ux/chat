<div class="page-body">
  <div class="container-xl flex-fill d-flex flex-column">
    <div class="card flex-fill">
      <div class="row g-0 flex-fill">
        <div class="col-12 col-lg-5 col-xl-3 border-end d-flex flex-column">
          <div class="card-header d-none d-md-block">
            <div class="input-icon">
              <span class="input-icon-addon">
                <!-- Download SVG icon from http://tabler.io/icons/icon/search -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="icon icon-1">
                  <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path>
                  <path d="M21 21l-6 -6"></path>
                </svg>
              </span>
              <input type="text" value="" class="form-control" placeholder="Search…" aria-label="Search">
            </div>
          </div>
          <div class="card-body p-0 scrollable flex-fill">
            <div class="nav flex-column nav-pills" role="tablist">
              <a [class.active]="selectedUser.id == item?.id" class="nav-link text-start mw-100 p-3" id="chat-1-tab"
                (click)="selectedUser = item" *ngFor="let item of users" data-bs-toggle="pill" role="tab"
                aria-selected="false" tabindex="-1">
                <div class="row align-items-center flex-fill">
                  <div class="col-auto"><span class="avatar avatar-1"
                      [style]="'background-image: url('+item.picture+')'"> </span></div>
                  <div class="col text-body">
                    <div>{{ item.name }}</div>
                    <div class="text-secondary text-truncate w-100">
                      <span *ngIf="selectedUser.id == item.id" class="text-success">Online</span>
                      <span *ngIf="selectedUser.id != item.id" class="text-danger"> Offline</span>
                    </div>
                  </div>
                </div>
              </a>


            </div>
          </div>
        </div>
        <div class="col-12 col-lg-7 col-xl-9 d-flex flex-column">
          <div class="card-body scrollable" style="height: 80vh;">
            <div class="chat">
              <div class="chat-bubbles">
                <div class="chat-item" [hidden]="item?.is_deleted" *ngFor="let item of chatMessages"
                  (mouseenter)="hoveredMessageId = item.id" (mouseleave)="hoveredMessageId = null"
                  style="position: relative;">
                  <div class="row align-items-end" [class.justify-content-end]="item.side == 'right'">
                    <div class="col col-lg-6 shadow-sm rounded-2 my-2">
                      <div class="chat-bubble chat-bubble-me">
                        <div class="chat-bubble-title">
                          <div class="row">
                            <div class="col chat-bubble-author fw-semibold">{{ item?.character_name }}</div>
                            <div class="col-auto chat-bubble-date fw-semibold">{{item?.updated_at | date:'HH:mm'}}</div>
                          </div>
                        </div>
                        <div class="chat-bubble-body" *ngIf="item?.message_type == 'text'">
                          <p>{{ item?.text }}</p>
                        </div>
                        <div class="chat-bubble-body" *ngIf="item?.message_type == 'image'">
                          <div class="mt-2">
                            <img [src]="item?.file" class="rounded img-fluid" />
                          </div>
                        </div>
                        <div class="chat-bubble-body" *ngIf="item?.message_type == 'file'">
                          <a [href]="item?.file" [download]="item?.file_name" class="btn btn-sm btn-outline-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                              fill="none" stroke="currentColor" stroke-width="2">
                              <path d="M21 15v4a2 2 0 0 1 -2 2h-16a2 2 0 0 1 -2 -2v-4"></path>
                              <polyline points="7 10 12 15 17 10"></polyline>
                              <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            {{ item?.file_name }}
                          </a>
                        </div>
                        <div class="chat-bubble-body" *ngIf="item?.message_type == 'text+image'">
                          <p>{{ item?.text }}</p>
                          <div class="mt-2">
                            <img [src]="item?.file" class="rounded img-fluid" />
                          </div>
                        </div>
                        <div class="chat-bubble-body" *ngIf="item?.message_type == 'text+file'">
                          <p>{{ item?.text }}</p>
                          <div class="mt-2">
                            <a [href]="item?.file" [download]="item?.file_name" class="btn btn-sm btn-primary">
                              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1 -2 2h-16a2 2 0 0 1 -2 -2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                              </svg>
                              {{ item?.file_name }}
                            </a>
                          </div>
                        </div>
                      </div>
                    </div>
                    <!-- Hover action menu (positioned outside col) -->
                    <div *ngIf="hoveredMessageId === item.id" class="chat-actions w-25"
                      [ngClass]="{'chat-actions-right': item.side == 'right', 'chat-actions-left': item.side == 'left'}">
                      <button type="button" class="btn btn-sm btn-icon" title="Pin message"
                        (click)="togglePinMessage(item)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                          stroke="currentColor" stroke-width="2">
                          <line x1="12" y1="17" x2="12" y2="7"></line>
                          <polyline points="18 8 12 2 6 8"></polyline>
                          <line x1="4" y1="21" x2="20" y2="21"></line>
                        </svg>
                      </button>
                      <button type="button" class="btn btn-sm btn-icon" title="Edit message"
                        (click)="openEditModal(item)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                          stroke="currentColor" stroke-width="2">
                          <path d="M11 4H4a2 2 0 0 0 -2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2 -2v-7"></path>
                          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1 -4 9.5 -9.5z"></path>
                        </svg>
                      </button>
                      <button type="button" class="btn btn-sm btn-icon btn-danger" title="Delete message"
                        (click)="deleteMessage(item)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                          stroke="currentColor" stroke-width="2">
                          <polyline points="3 6 5 6 21 6"></polyline>
                          <path d="M19 6v14a2 2 0 0 1 -2 2H7a2 2 0 0 1 -2 -2V6m3 0V4a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v2">
                          </path>
                          <line x1="10" y1="11" x2="10" y2="17"></line>
                          <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                      </button>
                    </div>
                    <div class="col-auto"><span class="avatar avatar-1"
                        [style]="'background-image: url('+getChatBodyUserImage(item.character)+')'"> </span></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <!-- File input (hidden) -->
            <input #fileInput type="file" style="display: none;" (change)="onFileSelected($event)"
              accept="image/*,.pdf,.doc,.docx,.txt,.xls,.xlsx">

            <!-- File preview (if image selected) -->
            <div *ngIf="filePreviewUrl" class="mb-2">
              <div class="alert alert-info d-flex justify-content-between align-items-center">
                <div>
                  <small><strong>File:</strong> {{ selectedFile?.name }}</small>
                  <br>
                  <img *ngIf="selectedFile?.type?.startsWith('image/')" [src]="filePreviewUrl" class="img-fluid mt-2"
                    style="max-height: 150px;">
                </div>
                <button type="button" class="btn btn-sm btn-outline-danger" (click)="clearMessage()">
                  Remove
                </button>
              </div>
            </div>

            <!-- Message input area -->
            <div class="input-group input-group-flat">
              <input #messageInput type="text" class="form-control" autocomplete="off" placeholder="Type message"
                [(ngModel)]="messageText" (keyup.enter)="sendMessage()">
              <span class="input-group-text">
                <!-- Emoji button -->
                <a href="javascript:void(0);" class="link-secondary" data-bs-toggle="tooltip" aria-label="Add emoji"
                  data-bs-original-title="Add emoji">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-1">
                    <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"></path>
                    <path d="M9 10l.01 0"></path>
                    <path d="M15 10l.01 0"></path>
                    <path d="M9.5 15a3.5 3.5 0 0 0 5 0"></path>
                  </svg>
                </a>
                <!-- Attach file button -->
                <a href="javascript:void(0);" class="link-secondary ms-2" data-bs-toggle="tooltip"
                  aria-label="Attach file" data-bs-original-title="Attach file or image" (click)="fileInput.click()">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-1">
                    <path
                      d="M15 7l-6.5 6.5a1.5 1.5 0 0 0 3 3l6.5 -6.5a3 3 0 0 0 -6 -6l-6.5 6.5a4.5 4.5 0 0 0 9 9l6.5 -6.5">
                    </path>
                  </svg>
                </a>
                <!-- Send button -->
                <button type="button" class="btn btn-primary btn-sm ms-2" (click)="sendMessage()"
                  [disabled]="!messageText.trim() && !selectedFile">
                  Send
                </button>
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal" [class.show]="showEditModal" [style.display]="showEditModal ? 'block' : 'none'" tabindex="-1">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Message</h5>
        <button type="button" class="btn-close" (click)="closeEditModal()"></button>
      </div>
      <div class="modal-body">
        <!-- File input (hidden) -->
        <input #editFileInput type="file" style="display: none;" (change)="onEditFileSelected($event)"
          accept="image/*,.pdf,.doc,.docx,.txt,.xls,.xlsx">

        <!-- Edit file preview -->
        <div *ngIf="editFilePreviewUrl" class="mb-3">
          <div class="alert alert-info d-flex justify-content-between align-items-center">
            <div>
              <small><strong>File:</strong> {{ editFile?.name }}</small>
              <br>
              <img *ngIf="editFile?.type?.startsWith('image/')" [src]="editFilePreviewUrl" class="img-fluid mt-2"
                style="max-height: 150px;">
            </div>
            <button type="button" class="btn btn-sm btn-outline-danger"
              (click)="editFile = null; editFilePreviewUrl = null;">
              Remove
            </button>
          </div>
        </div>

        <!-- Edit text area -->
        <div class="form-group mb-3">
          <label class="form-label">Message Text</label>
          <textarea class="form-control" rows="3" [(ngModel)]="editText" placeholder="Enter message text..."></textarea>
        </div>

        <!-- File attachment section -->
        <div class="form-group mb-3">
          <label class="form-label">Attachment (optional)</label>
          <button type="button" class="btn btn-outline-secondary w-100" (click)="editFileInput.click()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" class="me-2">
              <path d="M15 7l-6.5 6.5a1.5 1.5 0 0 0 3 3l6.5 -6.5a3 3 0 0 0 -6 -6l-6.5 6.5a4.5 4.5 0 0 0 9 9l6.5 -6.5">
              </path>
            </svg>
            {{ editFile ? 'Change File' : 'Attach File' }}
          </button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeEditModal()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="saveEditedMessage()">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal backdrop -->
<div class="modal-backdrop fade" [class.show]="showEditModal" *ngIf="showEditModal"></div>

<style>
  .chat-actions {
    position: absolute;
    top: 0;
    display: flex;
    gap: 4px;
    background: white;
    padding: 4px 8px;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    z-index: 100;
    white-space: nowrap;
  }

  .chat-actions-left {
    right: -50px;
  }

  .chat-actions-right {
    left: -50px;
  }

  .chat-actions .btn {
    padding: 4px 8px;
    border: none;
    background: transparent;
    color: #6c757d;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .chat-actions .btn:hover {
    color: #495057;
    background: #f1f3f5;
    border-radius: 3px;
  }

  .chat-actions .btn-danger:hover {
    color: #dc3545;
    background: #ffe0e0;
  }

  .modal.show {
    z-index: 1050;
  }

  .modal-backdrop {
    z-index: 1040;
  }
</style>
