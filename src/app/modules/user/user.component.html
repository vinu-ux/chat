<div class="col-12">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Character</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="userForm">
        <div class="space-y">
          <div>
            <h4>Personal Info</h4>
          </div>
          <div class="row row-cols-2 g-4">
            <div>
              <mat-form-field class="example-full-width w-100" appearance="outline">
                <mat-label>Full Name</mat-label>
                <input matInput placeholder="UserName" formControlName="name" required />
              </mat-form-field>
            </div>
            <div>
              <mat-form-field class="example-full-width w-100" appearance="outline">
                <mat-label>User Name</mat-label>
                <input matInput placeholder="Enter user name" formControlName="shortname" />
              </mat-form-field>
            </div>
            <div>
              <mat-form-field class="example-full-width w-100" appearance="outline">
                <mat-label>Gender</mat-label>
                <mat-select formControlName="gender">
                  <mat-option value="male">Male</mat-option>
                  <mat-option value="female">Female</mat-option>
                  <mat-option value="others">Others</mat-option>
                </mat-select>
              </mat-form-field>

            </div>
            <div>
              <mat-form-field class="example-full-width w-100" appearance="outline">
                <mat-label>Age</mat-label>
                <input matInput type="number" placeholder="Enter age" formControlName="age" />
              </mat-form-field>
            </div>
          </div>

          <div>
            <mat-form-field class="example-full-width w-100" appearance="outline">
              <mat-label>Address</mat-label>
              <textarea matInput placeholder="Address" formControlName="address" maxlength="50"></textarea>
            </mat-form-field>
          </div>


          <div class="row">
            <div class="col-6">
              <mat-form-field class="example-full-width w-100" appearance="outline">
                <mat-label>Relation</mat-label>
                <input matInput placeholder="Enter relation" formControlName="relation" />
              </mat-form-field>
            </div>
            <div class="col-6">
              <mat-form-field class="example-full-width w-100" appearance="outline">
                <mat-label>Select Content</mat-label>
                <mat-select formControlName="content" multiple>
                  <mat-select-trigger>
                    {{ getContentNames() }}
                  </mat-select-trigger>
                  <mat-option *ngFor="let item of contentOptions" [value]="item.id">
                    {{ item.name }}
                  </mat-option>
                </mat-select>
              </mat-form-field>
            </div>

          </div>

          <div class="row">

            <div class="col-2">
              <div>
                <section class="example-section">
                  <mat-checkbox class="example-margin" formControlName="isActive">Is Active</mat-checkbox>
                </section>
              </div>
            </div>
            <div class="col-2">
              <label for="btn-radio-toolbar-6" (click)="pic.click()"
                class="btn btn-icon"><!-- Download SVG icon from http://tabler.io/icons/icon/file-plus -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="icon icon-1">
                  <path d="M14 3v4a1 1 0 0 0 1 1h4"></path>
                  <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"></path>
                  <path d="M12 11l0 6"></path>
                  <path d="M9 14l6 0"></path>
                </svg></label> Attachments
            </div>
            <input type="file" #pic hidden (change)="onFileSelected($event)" accept="image/*">
            <div class="col-2" *ngIf="selectedPreview">
              <div class="mb-2">Preview</div>
              <img [src]="selectedPreview" alt="preview"
                style="width:72px;height:72px;object-fit:cover;border-radius:6px;" />
            </div>
          </div>

          <div class="text-end">
            <button type="button" class="btn btn-1" (click)="userForm.reset()"> Cancel </button>
            <ng-container *ngIf="!viewOnly">
              <button type="button" class="btn btn-primary btn-2" (click)="submitForm()"> Save Changes </button>
            </ng-container>
            <ng-container *ngIf="viewOnly">
              <button type="button" class="btn btn-1 ms-2" (click)="enableEditing()"> Edit </button>
              <button type="button" class="btn btn-primary btn-2 ms-2" (click)="dialogRef.close()"> Close </button>
            </ng-container>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
